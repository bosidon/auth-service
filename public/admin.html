<!DOCTYPE html>
<html lang="zh-CN">
<head>

<link rel="stylesheet" href="/assets/xianbao/xianbao-topbar.css">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: #0d0d12;
  color: #e0e0e0;
  min-height: 100vh;
  padding-top: 60px;
}
.topbar-spacer { height: 60px; }
.container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
.page-header {
  display: flex; justify-content: space-between; align-items: center;
  padding: 24px 0 20px; border-bottom: 1px solid #1e1e2a; margin-bottom: 24px;
}
.page-header h1 {
  font-size: 22px; font-weight: 700;
  background: linear-gradient(135deg, #a78bfa, #7c3aed);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
}
.page-header .user-info { font-size: 13px; color: #888; }
.page-header .user-info strong { color: #ccc; }
.stats-bar { display: flex; gap: 16px; margin-bottom: 24px; flex-wrap: nowrap; }
.stat-card {  background: #14141e; border: 1px solid #1e1e2a; border-radius: 10px;  padding: 16px 20px; flex: 1; min-width: 120px;  border-left: 3px solid #a78bfa;}.stat-card.vip { border-left-color: #f59e0b; }.stat-card.admin { border-left-color: #60a5fa; }.stat-card.regular { border-left-color: #34d399; }.stat-card .num-wrap {  display: flex; align-items: baseline; gap: 2px;}.stat-card .num { font-size: 28px; font-weight: 700; color: #a78bfa; }.stat-card.vip .num { color: #f59e0b; }.stat-card.admin .num { color: #60a5fa; }.stat-card.regular .num { color: #34d399; }.stat-card .label { font-size: 13px; color: #888; margin-top: 4px; }
.table-wrap {
  background: #14141e; border: 1px solid #1e1e2a; border-radius: 12px;
  overflow-x: auto;
}
table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  .usage-col { text-align: center; width: 42px; min-width: 42px; }
  .usage-num { text-align: center; font-size: 13px; }
  /* 数字/日期列最小宽度 */
  th:nth-child(1), td:nth-child(1) { width: 44px; min-width: 44px; text-align: center; }
  th:nth-child(6), td:nth-child(6), th:nth-child(11), td:nth-child(11) { width: 96px; min-width: 96px; white-space: nowrap; }
  th:nth-child(4), td:nth-child(4), th:nth-child(5), td:nth-child(5) { width: 100px; min-width: 100px; }
  th:nth-child(12), td:nth-child(12) { width: 80px; }
  .contact-cell { font-size: 12.5px; line-height: 1.7; color: #ccc; }
  .contact-cell .c-email { color: #94a3b8; word-break: break-all; }
  .contact-cell .c-phone { color: #7dd3fc; }
  .contact-cell .c-wx { color: #6ee7b7; }
thead { background: #1a1a26; }
th {
  padding: 10px 12px; text-align: left; font-size: 12px;
  font-weight: 600; color: #888; text-transform: uppercase; letter-spacing: 0.5px;
  white-space: nowrap;
}
td { padding: 8px 12px; font-size: 13px; border-top: 1px solid #1e1e2a; vertical-align: top; }
tr:hover td { background: #1a1a26; }
.role-badge {
  display: inline-block; padding: 3px 10px; border-radius: 20px;
  font-size: 12px; font-weight: 600;
}
.role-badge.admin { background: #7c3aed22; color: #a78bfa; border: 1px solid #7c3aed44; }
.role-badge.user { background: #1e1e2a; color: #888; border: 1px solid #2a2a3a; }

.plan-badge {
  display: inline-block; padding: 3px 10px; border-radius: 20px;
  font-size: 12px; font-weight: 600;
}
.plan-badge.vip { background: #f59e0b22; color: #fbbf24; border: 1px solid #f59e0b44; }
.plan-badge.free { background: #1e1e2a; color: #888; border: 1px solid #2a2a3a; }
.role-select, .plan-select, .comm-select {
  background: #1a1a26; color: #e0e0e0; border: 1px solid #2a2a3a;
  border-radius: 6px; padding: 5px 10px; font-size: 13px; cursor: pointer;
  outline: none;
}
.role-select:focus, .plan-select:focus, .comm-select:focus { border-color: #7c3aed; }
.toolbar {
  display: flex; gap: 12px; align-items: center; margin-bottom: 16px; flex-wrap: nowrap;
}
.search-box {
  background: #1a1a26; border: 1px solid #2a2a3a; border-radius: 8px;
  padding: 8px 14px; color: #e0e0e0; font-size: 14px; width: 260px;
  outline: none; transition: border-color 0.2s;
}
.search-box::placeholder { color: #555; }
.search-box:focus { border-color: #7c3aed; }
.btn {
  background: #7c3aed; color: #fff; border: none; border-radius: 8px;
  padding: 8px 18px; font-size: 14px; cursor: pointer; transition: background 0.2s;
}
.btn:hover { background: #6d28d9; }
.btn-outline {
  background: transparent; color: #a78bfa; border: 1px solid #7c3aed44;
  padding: 8px 18px; font-size: 14px; border-radius: 8px; cursor: pointer;
  transition: all 0.2s;
}
.btn-outline:hover { background: #7c3aed15; border-color: #7c3aed; }
.pagination {
  display: flex; justify-content: center; align-items: center; gap: 8px;
  padding: 16px; border-top: 1px solid #1e1e2a;
}
.pagination button {
  background: #1a1a26; color: #aaa; border: 1px solid #2a2a3a;

  transition: all 0.2s;
}
.pagination button:hover:not(:disabled) { background: #2a2a3a; color: #e0e0e0; }
.pagination button:disabled { opacity: 0.3; cursor: not-allowed; }
.pagination .page-info { font-size: 13px; color: #666; margin: 0 8px; }
.toast {
  position: fixed; top: 80px; right: 20px; z-index: 9999;
  padding: 12px 20px; border-radius: 8px; font-size: 14px;
  transform: translateX(120%); transition: transform 0.3s ease;
  max-width: 360px;
}
.toast.show { transform: translateX(0); }
.toast.success { background: #065f4622; border: 1px solid #059669; color: #6ee7b7; }
.toast.error { background: #7f1d1d22; border: 1px solid #dc2626; color: #fca5a5; }
.loading {
  text-align: center; padding: 60px 20px; color: #666;
}
.loading .spinner {
  display: inline-block; width: 32px; height: 32px;
  border: 3px solid #1e1e2a; border-top-color: #a78bfa;
  border-radius: 50%; animation: spin 0.8s linear infinite;
  margin-bottom: 8px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.usage-cell { font-size: 12px; color: #888; white-space: nowrap; }
.usage-cell .used { color: #a78bfa; }
.usage-cell .full { color: #f87171; }
.settings-panel {
  background: #14141e; border: 1px solid #1e1e2a; border-radius: 10px;
  padding: 16px 20px; margin-bottom: 16px;
}
.settings-panel .title {
  font-size: 14px; font-weight: 600; color: #a78bfa; margin-bottom: 8px;
}
.settings-panel .row {
  display: flex; gap: 16px; align-items: flex-end; flex-wrap: nowrap;
}
.settings-field {
  display: flex; flex-direction: column; gap: 4px;
}
.settings-field label {
  font-size: 12px; color: #666;
}
.settings-field input {
  background: #1a1a26; color: #e0e0e0; border: 1px solid #2a2a3a;
  border-radius: 6px; padding: 6px 10px; font-size: 14px; width: 80px;
  outline: none; text-align: center;
}
.settings-field input:focus { border-color: #7c3aed; }
.settings-panel .save-btn {
  background: #065f46; color: #6ee7b7; border: 1px solid #059669;
  border-radius: 6px; padding: 6px 18px; font-size: 13px; cursor: pointer;
  transition: all 0.2s;
}
.settings-panel .save-btn:hover { background: #047857; }

.stats-panel {
  background: #14141e; border: 1px solid #1e1e2a; border-radius: 10px;
  padding: 16px 20px; margin-bottom: 16px;
}
.stats-panel .title {
  font-size: 14px; font-weight: 600; color: #a78bfa; margin-bottom: 8px;
}
.stats-row {
  display: flex; gap: 16px; flex-wrap: nowrap;
}
.stat-item {
  display: flex; flex-direction: row; align-items: center;
  gap: 6px;
}
.stat-num {
  font-size: 15px; font-weight: 700; color: #fbbf24;
}
.stat-label {
  font-size: 12px; color: #888;
}

@media (max-width: 768px) {  .settings-field input { width: 80px; flex: none; }  .settings-panel .row { flex-wrap: wrap; gap: 10px; }  .stats-bar { flex-direction: row; flex-wrap: wrap; gap: 10px; }  .stats-bar .stat-card { min-width: calc(50% - 5px); flex: none; padding: 12px 14px; }  .stats-bar .stat-card .num { font-size: 22px; }  .stats-bar .stat-card .label { font-size: 12px; }  .toolbar { flex-direction: row; flex-wrap: nowrap; gap: 6px; }  .toolbar .search-box { width: auto; flex: 1; min-width: 0; }  .toolbar .btn, .toolbar .btn-outline { white-space: nowrap; flex-shrink: 0; }  .page-header { flex-direction: column; align-items: flex-start; gap: 8px; }  /* 表格：移动端保持列宽（容器可横向滑动），联系方式列竖排完整显示 */  .table-wrap table { table-layout: auto; min-width: 880px; }  .table-wrap th, .table-wrap td { white-space: nowrap; }  .contact-cell { min-width: 165px; white-space: normal; }  .contact-cell > div { white-space: nowrap; }}
</style>

<script>
const API_BASE = '/api';
const PAGE_SIZE = 50;

let currentPage = 1;
let currentSearch = '';
let currentUser = null;
let allUsageMap = {};

// Service labels
const SERVICE_LABELS = {
  tarot: '塔罗',
  maya: '玛雅',
  psych_test: '测评',
  reading: '阅读'
};

const FREE_LIMITS = { tarot: 20, maya: 3, psych_test: 3, reading: 3 };

function showToast(msg, type = 'success') {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast ' + type;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

function fmtDate(dateStr) {
  if (!dateStr) return '-';
  const d = new Date(dateStr);
  return d.toLocaleDateString('zh-CN', { year:'numeric', month:'2-digit', day:'2-digit' });
}

function escHtml(s) {
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

function renderUsers(users) {
  const tbody = document.getElementById('userTableBody');
  if (!users || users.length === 0) {
    document.getElementById('tableContent').style.display = 'none';
    document.getElementById('emptyState').style.display = 'block';
    document.getElementById('errorState').style.display = 'none';
    document.getElementById('loadingState').style.display = 'none';
    return;
  }

  document.getElementById('tableContent').style.display = 'block';
  document.getElementById('emptyState').style.display = 'none';
  document.getElementById('errorState').style.display = 'none';
  document.getElementById('loadingState').style.display = 'none';

  tbody.innerHTML = users.map(u => {
    const isSelf = currentUser && currentUser.id === u.id;
    const roleClass = u.role === 'admin' ? 'admin' : (u.role === 'sales' ? 'sales' : 'user');
    const roleName  = u.role === 'admin' ? '管理员' : (u.role === 'sales' ? '推广员' : '普通用户');

    // Role dropdown
    let roleSelect = '<span class="role-badge ' + roleClass + '">' + roleName + '</span>';
    if (!isSelf) {
      roleSelect = '<select class="role-select" data-user-id="' + u.id + '" data-original-role="' + u.role + '">' +
        '<option value="user" ' + (u.role === 'user' ? 'selected' : '') + '>普通用户</option>' +
        '<option value="admin" ' + (u.role === 'admin' ? 'selected' : '') + '>管理员</option>' +
        '<option value="sales" ' + (u.role === 'sales' ? 'selected' : '') + '>推广员</option>' +
      '</select>';
    }

    // Plan display
    let planLabel = '免费';
    let planClass = 'free';
    if (u.plan === 'vip') {
      if (u.expires_at) {
        const d = new Date(u.expires_at);
        const remaining = Math.ceil((d - new Date()) / (1000 * 60 * 60 * 24));
        planLabel = '年卡(' + remaining + '天)';
        planClass = 'vip';
      } else {
        planLabel = '终身会员';
        planClass = 'vip';
      }
    }
    let planSelect = '<span class="plan-badge ' + planClass + '">' + planLabel + '</span>';
    if (!isSelf) {
      const _expDays = u.expires_at ? (new Date(u.expires_at) - new Date()) / 86400000 : 0;
    const curPlan = u.plan !== 'vip' ? 'free' : ((!u.expires_at || _expDays > 400) ? 'lifetime' : 'yearly');
      planSelect = '<select class="plan-select" data-user-id="' + u.id + '" data-original-plan="' + curPlan + '">' +
        '<option value="free" ' + (curPlan === 'free' ? 'selected' : '') + '>免费</option>' +
        '<option value="yearly" ' + (curPlan === 'yearly' ? 'selected' : '') + '>年卡</option>' +
        '<option value="lifetime" ' + (curPlan === 'lifetime' ? 'selected' : '') + '>3 年卡</option>' +
      '</select>';
    }

    // Usage display（4 列数字）
    const usage = allUsageMap[u.id] || [];
    const um = {};
    (usage || []).forEach(function(s) { um[s.service] = s.used; });
    const svcList = ['tarot', 'maya', 'psych_test', 'reading'];
    const usageTds = svcList.map(function(s) {
      return '<td class="usage-num">' + (um[s] !== undefined ? um[s] : '-') + '</td>';
    }).join('');

    // 联系方式列（虚拟邮箱不显示，有什么显示什么）
    function isVirtualEmail(em) {
      if (!em) return true;
      return /@(sms\.local|wechat\.local|xianbao\.online)$/i.test(em) || /^verify@/.test(em);
    }
    const contactParts = [];
    if (u.email && !isVirtualEmail(u.email)) contactParts.push('<div class="c-email">📧 ' + escHtml(u.email) + '</div>');
    if (u.phone) contactParts.push('<div class="c-phone">📱 ' + escHtml(u.phone) + '</div>');
    if (u.wechat_bound > 0) contactParts.push('<div class="c-wx">💬 微信已绑定</div>');
    const contactHtml = contactParts.length ? contactParts.join('') : '<span style="color:#555">—</span>';

    return `<tr>
      <td style="color:#666">${u.id}</td>
      <td style="min-width:80px"><strong>${escHtml(u.nickname || '未设置')}</strong></td>
      <td class="contact-cell">${contactHtml}</td>
      <td>${roleSelect}</td>
      <td>${planSelect}</td>
      <td style="color:#888;font-size:12px">${u.plan === 'vip' && u.expires_at ? fmtDate(u.expires_at) : '-'}</td>
      ${usageTds}
      <td style="color:#666;font-size:13px">${fmtDate(u.created_at)}</td>
      <td>
        ${!isSelf ? `<div style="display:flex;gap:6px;flex-wrap:nowrap">` + `<button class="btn-danger" style="padding:4px 10px;font-size:12px;white-space:nowrap;border:none;border-radius:6px;background:#ef4444;color:#fff;cursor:pointer" onclick="deleteUser(${u.id}, '${(u.nickname||'').replace(/'/g, "\\'")}')">删除</button>` + (u.plan === 'vip' && u.expires_at ? `<button class="btn-outline" style="padding:4px 10px;font-size:12px;white-space:nowrap" onclick="renewPlan(${u.id})">续卡</button>` : '') + `</div>` : '-'}
      </td>
    </tr>`;
  }).join('');

  // Bind role change
  document.querySelectorAll('.role-select[data-user-id]').forEach(sel => {
    sel.addEventListener('change', function() {
      const userId = this.dataset.userId;
      const newRole = this.value;
      const roleLabel = newRole === 'admin' ? '管理员' : (newRole === 'sales' ? '推广员' : '普通用户');
      if (!confirm(`确定将用户 #${userId} 的角色改为「${roleLabel}」？`)) {
        this.value = this.dataset.originalRole;
        return;
      }
      updateField(userId, 'role', newRole, this, 'originalRole');
    });
  });

  // Bind plan change
  document.querySelectorAll('.plan-select[data-user-id]').forEach(function(sel) {
    sel.addEventListener('change', function() {
      var userId = this.dataset.userId;
      var newPlan = this.value;
      var labels = { 'free': '免费版', 'yearly': '年卡', 'lifetime': '3 年卡' };
      if (!confirm('确定将用户 #' + userId + ' 的套餐改为「' + (labels[newPlan] || newPlan) + '」？')) {
        this.value = this.dataset.originalPlan;
        return;
      }
      updateField(userId, 'plan', newPlan, this, 'originalPlan');
    });
  });
}

async function updateField(userId, field, value, selectEl, originalAttr) {
  try {
    const res = await fetch(`${API_BASE}/users/${userId}/${field}`, {
      method: 'PATCH',
      credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ [field]: value })
    });
    const json = await res.json();
    if (!json.success) throw new Error(json.error || '更新失败');

    selectEl.dataset[originalAttr] = value;
    showToast(`✅ 用户 #${userId} ${field === 'role' ? '角色' : '套餐'}已更新`);
    loadUsers();
  } catch (err) {
    selectEl.value = selectEl.dataset[originalAttr];
    showToast('❌ ' + err.message, 'error');
  }
}


// ===== 推广佣金 =====
let _commRows = [];
let _commReferrerFilter = '';   // 推荐人筛选状态（不依赖 DOM，避免重建丢失）
let _commReferrerNames = {};     // 推荐人 id -> 名称（用于显示结算范围）

function openSettleModal(title, html, onOk) {
  document.getElementById('settleTitle').textContent = title;
  document.getElementById('settleBody').innerHTML = html;
  const m = document.getElementById('settleModal');
  m.style.display = 'flex';
  const btn = document.getElementById('settleOkBtn');
  btn.onclick = async function() {
    btn.disabled = true; btn.textContent = '处理中…';
    try { await onOk(); } finally { btn.disabled = false; btn.textContent = '确认已结算'; closeSettleModal(); }
  };
}
function closeSettleModal() { document.getElementById('settleModal').style.display = 'none'; }

function openCommModal() {
  const m = document.getElementById('commModal');
  m.style.display = 'flex';
  loadCommissions();
  loadCommReferrers();
}
function closeCommModal() { document.getElementById('commModal').style.display = 'none'; }

async function loadCommReferrers() {
  try {
    const r = await fetch(API_BASE + '/users/commissions/referrers', { credentials: 'include' });
    const j = await r.json();
    const sel = document.getElementById('commReferrerFilter');
    if (!sel) return;
    if (!j.success) { showToast('❌ 推荐人列表加载失败：' + (j.error || '未知错误'), 'error'); return; }
    const list = j.data || [];
    _commReferrerNames = {};
    list.forEach(x => { _commReferrerNames[String(x.referrer_id)] = x.nickname || ('用户#' + x.referrer_id); });
    const cur = String(_commReferrerFilter || '');
    const emptyOpt = list.length ? '' : '<option value="" disabled>（暂无推广佣金记录）</option>';
    sel.innerHTML = '<option value=""' + (cur === '' ? ' selected' : '') + '>全部推荐人</option>' + emptyOpt +
      list.map(x => '<option value="' + x.referrer_id + '"' +
        (String(x.referrer_id) === cur ? ' selected' : '') + '>' +
        (x.nickname || ('用户#' + x.referrer_id)) +
        '（' + x.cnt + ' 条 / 待结 ¥' + Number(x.pending || 0).toFixed(2) + '）</option>').join('');
    sel.value = cur;   // 双保险
  } catch (e) { console.error(e); showToast('❌ 推荐人列表加载异常：' + e.message, 'error'); }
}

async function loadCommissions() {
  const st = (document.getElementById('commStatusFilter') || {}).value || 'pending';
  const rf = _commReferrerFilter;
  try {
    const r = await fetch(API_BASE + '/users/commissions/list?status=' + st + (rf ? '&referrer_id=' + rf : ''), { credentials: 'include' });
    const j = await r.json();
    const tb = document.getElementById('commTbody');
    if (!tb) return;
    if (!j.success) {
      tb.innerHTML = '<tr><td colspan="9" style="text-align:center;color:#fca5a5;padding:20px;">❌ ' + (j.error||'加载失败') + '</td></tr>';
      showToast('❌ 佣金列表加载失败：' + (j.error || '未知错误'), 'error');
      return;
    }
    const t = j.totals || {};
    document.getElementById('commPendingTotal').textContent = '¥' + ((t.pending||0)).toFixed(2);
    document.getElementById('commSettledTotal').textContent = '¥' + ((t.settled||0)).toFixed(2);
    _commRows = j.data;
    if (!j.data.length) { tb.innerHTML = '<tr><td colspan="9" style="text-align:center;color:#888;padding:20px;">📭 暂无佣金记录</td></tr>'; return; }
    const stMap = { pending: '待结算', settled: '已结算', cancelled: '已取消' };
    const stColor = { pending: '#fbbf24', settled: '#34d399', cancelled: '#888' };
    tb.innerHTML = j.data.map(c => '<tr>' +
      '<td>' + c.id + '</td>' +
      '<td style="font-size:12px;color:#888;">' + String(c.created_at||'').slice(0,16) + '</td>' +
      '<td>' + (c.referrer_name || ('#'+c.referrer_id)) + '</td>' +
      '<td>' + (c.referee_name || ('#'+c.referee_id)) + '</td>' +
      '<td>' + (c.plan || '-') + '</td>' +
      '<td>¥' + Number(c.order_amount||0).toFixed(2) + '</td>' +
      '<td style="color:#a78bfa;font-weight:600;">¥' + Number(c.commission||0).toFixed(2) + '</td>' +
      '<td style="color:' + (stColor[c.status]||'#888') + ';font-size:12px;">' + (stMap[c.status]||c.status) + '</td>' +
      '<td>' + (c.status === 'pending'
        ? '<button style="padding:3px 10px;font-size:12px;border:none;border-radius:6px;background:#059669;color:#fff;cursor:pointer;margin-right:4px;" onclick="settleComm(' + c.id + ')">已结算</button>' +
          '<button style="padding:3px 10px;font-size:12px;border:none;border-radius:6px;background:#374151;color:#9ca3af;cursor:pointer;" onclick="cancelComm(' + c.id + ')">取消</button>'
        : '-') + '</td>' +
    '</tr>').join('');
  } catch (e) { console.error('loadCommissions', e); }
}

async function settleComm(id) {
  const c = _commRows.find(x => String(x.id) === String(id));
  if (!c) return;
  openSettleModal('确认结算佣金',
    '推荐人：<b style="color:#c4b5fd;">' + (c.referrer_name || ('#' + c.referrer_id)) + '</b><br>' +
    '被推荐人：' + (c.referee_name || ('#' + c.referee_id)) + '<br>' +
    '套餐：' + (c.plan || '-') + '（订单 ¥' + Number(c.order_amount || 0).toFixed(2) + '）<br>' +
    '佣金（60%）：<b style="color:#a78bfa;font-size:16px;">¥' + Number(c.commission || 0).toFixed(2) + '</b><br>' +
    '<span style="font-size:12px;color:#94a3b8;">请先通过微信完成转账，再点击确认</span>',
    async () => {
      const r = await fetch(API_BASE + '/users/commissions/' + id + '/settle', { method: 'PATCH', credentials: 'include' });
      const j = await r.json();
      if (j.success) { showToast('✅ ' + j.message); loadCommissions(); loadCommReferrers(); }
      else showToast('❌ ' + (j.error || '操作失败'), 'error');
    });
}

async function settleAll() {
  const rf = _commReferrerFilter;
  const scopeName = rf ? (_commReferrerNames[String(rf)] || ('用户#' + rf)) : '全部推荐人';
  try {
    const r = await fetch(API_BASE + '/users/commissions/list?status=pending' + (rf ? '&referrer_id=' + rf : ''), { credentials: 'include' });
    const j = await r.json();
    if (!j.success || !j.data.length) { showToast('没有待结算的佣金', 'error'); return; }
    const rows = j.data;
    const sum = rows.reduce((a, x) => a + Number(x.commission || 0), 0);
    const byRef = {};
    rows.forEach(x => {
      const k = x.referrer_name || ('#' + x.referrer_id);
      byRef[k] = (byRef[k] || 0) + Number(x.commission || 0);
    });
    const list = Object.keys(byRef).map(k =>
      '<div style="display:flex;justify-content:space-between;font-size:13px;color:#cbd5e1;">' +
      '<span>' + k + '</span><span style="color:#a78bfa;">¥' + byRef[k].toFixed(2) + '</span></div>').join('');
    openSettleModal('确认全部结算 · ' + scopeName,
      '待结算 <b>' + rows.length + '</b> 条，合计 <b style="color:#fbbf24;font-size:16px;">¥' + sum.toFixed(2) + '</b>' +
      '<div style="margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.08);">' + list + '</div>' +
      '<div style="font-size:12px;color:#94a3b8;margin-top:10px;">请先完成全部转账，再点击确认</div>',
      async () => {
        const rr = await fetch(API_BASE + '/users/commissions/settle-all', {
          method: 'PATCH', credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(rf ? { referrer_id: parseInt(rf) } : {})
        });
        const jj = await rr.json();
        if (jj.success) { showToast('✅ ' + jj.message); loadCommissions(); loadCommReferrers(); }
        else showToast('❌ ' + (jj.error || '操作失败'), 'error');
      });
  } catch (e) { showToast('❌ ' + e.message, 'error'); }
}

async function cancelComm(id) {
  if (!confirm('确认取消该佣金记录？\n（不计入结算）')) return;
  const r = await fetch(API_BASE + '/users/commissions/' + id + '/cancel', { method: 'PATCH', credentials: 'include' });
  const j = await r.json();
  if (j.success) { showToast('✅ ' + j.message); loadCommissions(); }
  else showToast('❌ ' + (j.error||'操作失败'), 'error');
}

function deleteUser(id, nickname) {
  if (!confirm('确定删除用户「' + (nickname || '#' + id) + '」？\n将同时删除其全部数据（用量/绑定/日志/阅读/测评/塔罗/留言），不可恢复！')) return;
  fetch('/api/users/' + id, { method: 'DELETE', credentials: 'include' })
    .then(r => r.json())
    .then(d => {
      if (d.success) { alert('已删除'); loadUsers(); }
      else alert(d.error || '删除失败');
    })
    .catch(() => alert('网络错误'));
}
async function loadUsers() {
  document.getElementById('loadingState').style.display = 'block';
  document.getElementById('tableContent').style.display = 'none';
  document.getElementById('errorState').style.display = 'none';
  document.getElementById('emptyState').style.display = 'none';

  try {
    let url = `${API_BASE}/users?page=${currentPage}&limit=${PAGE_SIZE}`;
    if (currentSearch) url += '&search=' + encodeURIComponent(currentSearch);

    const res = await fetch(url, { credentials: 'include' });
    if (res.status === 403) {
      document.getElementById('loadingState').style.display = 'none';
      document.getElementById('noAuthState').style.display = 'block';
      document.getElementById('pageHeader').style.display = 'none';
      document.getElementById('statsBar').style.display = 'none';
      return;
    }
    if (!res.ok) throw new Error('请求失败: ' + res.status);

    const json = await res.json();
    if (!json.success) throw new Error(json.error || '未知错误');

    const { users, total, page, limit } = json.data;
    currentPage = page;

    // Usage data already included from users list API (SQL JOIN)
    allUsageMap = {};
    users.forEach(u => {
      allUsageMap[u.id] = u.usage || [];
    });

    // Stats
    const vipUsers = users.filter(u => u.plan === 'vip').length;
    const adminUsers = users.filter(u => u.role === 'admin').length;
    document.getElementById('totalUsers').textContent = total;
    document.getElementById('vipCount').textContent = vipUsers;
    document.getElementById('adminCount').textContent = adminUsers;
    document.getElementById('regularCount').textContent = total - vipUsers;

    // Pagination
    const totalPages = Math.ceil(total / limit);
    document.getElementById('pageInfo').textContent = `第 ${page} 页 / 共 ${totalPages} 页（${total} 人）`;
    document.getElementById('prevPage').disabled = page <= 1;
    document.getElementById('nextPage').disabled = page >= totalPages;
    document.getElementById('prevPage').onclick = () => { currentPage--; loadUsers(); };
    document.getElementById('nextPage').onclick = () => { currentPage++; loadUsers(); };

    renderUsers(users);

  } catch (err) {
    document.getElementById('loadingState').style.display = 'none';
    document.getElementById('errorMsg').textContent = err.message;
    document.getElementById('errorState').style.display = 'block';
    // 仅未登录时注册：登录成功后刷新一次进入后台（避免已登录用户无限刷新）
    if (typeof XianbaoAuth !== 'undefined' && XianbaoAuth.onAuthChange) {
      var _admReloaded = false;
      XianbaoAuth.onAuthChange(function(state) {
        if (state.loggedIn && !_admReloaded) { _admReloaded = true; setTimeout(function(){ location.reload(); }, 600); }
      });
    }
  }
}

async function init() {
  try {
    // 优先复用 auth-widget 已缓存的用户（省一次 /api/auth/me 请求）
    // 组件 checkAuth 是异步的，轮询等待其完成（最多 1.5s）
    function getUserWithWait(timeoutMs) {
      return new Promise(function(resolve) {
        if (typeof XianbaoAuth === 'undefined' || !XianbaoAuth.getUser) return resolve(null);
        var start = Date.now();
        (function tryGet() {
          var u = XianbaoAuth.getUser();
          if (u) return resolve(u);
          if (Date.now() - start > timeoutMs) return resolve(null);
          setTimeout(tryGet, 100);
        })();
      });
    }
    let me = await getUserWithWait(1500);
    if (!me) {
      const meRes = await fetch(`${API_BASE}/auth/me`, { credentials: 'include' });
      if (!meRes.ok) throw new Error('未登录');
      const meJson = await meRes.json();
      if (!meJson.success) throw new Error('未登录');
      me = meJson.data;
    }

    currentUser = me;
    const planLabel = currentUser.plan === 'vip' ? 'VIP' : '免费';
    document.getElementById('userInfo').innerHTML =
      `<strong>${escHtml(currentUser.nickname || '用户')}</strong> · ${currentUser.email} · ` +
      `<span class="role-badge ${currentUser.role === 'admin' ? 'admin' : 'user'}">${currentUser.role === 'admin' ? '管理员' : '普通用户'}</span>` +
      ` · <span class="plan-badge ${currentUser.plan === 'vip' ? 'vip' : 'free'}">${planLabel}</span>`;

    if (currentUser.role !== 'admin') {
      document.getElementById('loadingState').style.display = 'none';
      document.getElementById('noAuthState').style.display = 'block';
      return;
    }

    loadUsers();
    loadSettings();
    loadStats();
    loadCommissions();
    loadCommReferrers();
    const _cf = document.getElementById('commStatusFilter');
    if (_cf) _cf.onchange = loadCommissions;
    const _rf = document.getElementById('commReferrerFilter');
    if (_rf) _rf.onchange = function() { _commReferrerFilter = this.value || ''; loadCommissions(); };

  } catch (e) {
    document.getElementById('loadingState').style.display = 'none';
    document.getElementById('noAuthState').style.display = 'block';
  }

  document.getElementById('searchBtn').addEventListener('click', () => {
    currentSearch = document.getElementById('searchInput').value.trim();
    currentPage = 1;
    document.getElementById('clearSearchBtn').style.display = currentSearch ? 'inline-block' : 'none';
    loadUsers();
  });
  document.getElementById('searchInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('searchBtn').click();
  });
  document.getElementById('clearSearchBtn').addEventListener('click', () => {
    document.getElementById('searchInput').value = '';
    currentSearch = '';
    currentPage = 1;
    document.getElementById('clearSearchBtn').style.display = 'none';
    loadUsers();
  });
}


async function renewPlan(userId) {
  if (!confirm(`确定为用户 #${userId} 续卡一年？`)) return;
  try {
    const res = await fetch(`/api/users/${userId}/renew`, {
      method: 'POST',
      credentials: 'include'
    });
    const json = await res.json();
    if (!json.success) throw new Error(json.error || '续卡失败');
    showToast(`✅ 用户 #${userId} 续卡成功`);
    loadUsers();
  } catch (err) {
    showToast('❌ ' + err.message, 'error');
  }
}


async function loadSettings() {
  try {
    const res = await fetch('/api/settings', { credentials: 'include' });
    if (!res.ok) return;
    const json = await res.json();
    if (!json.success) return;
    const d = json.data;
    document.getElementById('limitTarot').value = d.tarot || 0;
    document.getElementById('limitMaya').value = d.maya || 0;
    document.getElementById('limitPsychTest').value = d.psych_test || 0;
    document.getElementById('limitReading').value = d.reading || 0;
  } catch(e) {}
}

document.getElementById('saveLimitsBtn').addEventListener('click', async () => {
  const limits = {
    tarot: parseInt(document.getElementById('limitTarot').value) || 0,
    maya: parseInt(document.getElementById('limitMaya').value) || 0,
    psych_test: parseInt(document.getElementById('limitPsychTest').value) || 0,
    reading: parseInt(document.getElementById('limitReading').value) || 0
  };
  try {
    const res = await fetch('/api/settings', {
      method: 'PUT',
      credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ limits })
    });
    const json = await res.json();
    if (!json.success) throw new Error(json.error || '保存失败');
    showToast('✅ 免费次数已保存');
    loadUsers();
  } catch (err) {
    showToast('❌ ' + err.message, 'error');
  }
});


async function loadStats() {
  try {
    const res = await fetch('/api/usage/stats', { credentials: 'include' });
    if (!res.ok) return;
    const json = await res.json();
    if (!json.success) return;
    const d = json.data;
    const idMap = { tarot: 'statTarot', maya: 'statMaya', psych_test: 'statPsychTest', reading: 'statReading' };
    d.stats.forEach(s => {
      const el = document.getElementById(idMap[s.service]);
      if (el) el.textContent = s.total;
    });
    document.getElementById('statActiveUsers').textContent = d.activeUsers;
  } catch(e) {}
}

document.addEventListener('DOMContentLoaded', init);
</script>
