<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>账号设置 - 仙宝</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Noto Sans SC','PingFang SC',sans-serif;font-size:1rem;background:#0d0d12;color:#e0e0e0;min-height:100vh}
.container{max-width:560px;margin:0 auto;padding:24px 20px 60px}
.back{display:inline-flex;align-items:center;gap:6px;color:#94a3b8;font-size:0.88rem;text-decoration:none;margin-bottom:20px}
.back:hover{color:#e0e0e0}
.card{background:#14141e;border:1px solid #1e1e2a;border-radius:14px;padding:24px;margin-bottom:16px}
.card-title{font-size:0.88rem;font-weight:600;color:#94a3b8;margin-bottom:16px;display:flex;align-items:center;gap:6px}
.info-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.04);font-size:0.88rem;gap:8px}
.info-row:last-child{border-bottom:none}
.info-label{color:#94a3b8;white-space:nowrap;flex-shrink:0;width:50px}
.info-value{color:#e0e0e0;text-align:right;word-break:break-all;flex:1}
.info-row .edit-input{flex:1;padding:4px 8px;border:1px solid #1e1e2a;border-radius:6px;background:#0d0d12;color:#e0e0e0;font-size:0.82rem;outline:none;text-align:right}
.info-row .edit-input:focus{border-color:#7c3aed}
.info-row .edit-btn{padding:4px 10px;border:none;border-radius:5px;background:linear-gradient(135deg,#7c3aed,#6d28d9);color:#fff;font-size:0.75rem;font-weight:600;cursor:pointer;white-space:nowrap}
.info-row .edit-btn:hover{opacity:.85}
.info-row .save-hint{font-size:0.75rem;color:#34d399;margin-left:6px;display:none}
.avatar-wrap{display:flex;align-items:center;gap:16px}
.avatar{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,#7c3aed,#a78bfa);display:flex;align-items:center;justify-content:center;font-size:1.6rem;color:#fff;font-weight:700;overflow:hidden;flex-shrink:0;cursor:pointer;position:relative}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 20px;border-radius:8px;border:none;font-size:0.88rem;font-weight:600;cursor:pointer;transition:.2s;text-decoration:none;white-space:nowrap}
.btn-primary{background:linear-gradient(135deg,#7c3aed,#6d28d9);color:#fff}
.btn-primary:hover{opacity:.9}
.btn-outline{background:transparent;border:1px solid #1e1e2a;color:#94a3b8}
.btn-outline:hover{border-color:#7c3aed;color:#e0e0e0}
.btn-sm{padding:6px 14px;font-size:0.75rem}
.btn-full{width:100%;justify-content:center}
.binding-item{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.04);font-size:0.88rem}
.binding-item:last-child{border:none}
.binding-left{display:flex;align-items:center;gap:10px}
.binding-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:0.88rem}
.binding-icon.qq{background:rgba(18,183,245,.15);color:#12b7f5}
.binding-icon.wechat{background:rgba(7,193,96,.15);color:#07c160}
.binding-icon.phone{background:rgba(59,130,246,.15);color:#3b82f6}
.binding-icon.email{background:rgba(244,63,94,.15);color:#f43f5e}
.binding-name{font-size:0.88rem}
.binding-status{font-size:0.75rem;color:#6b7280}
.vip-row{display:flex;align-items:center;justify-content:space-between}
.vip-plan{font-size:1rem;font-weight:600}
.vip-plan.free{color:#6b7280}
.vip-plan.vip{color:#f59e0b}
.vip-expires{font-size:0.75rem;color:#6b7280;margin-top:2px}
.desc{font-size:0.75rem;color:#6b7280;margin-top:4px}
.sec{margin-top:16px;padding-top:16px;border-top:1px solid rgba(255,255,255,.06)}
.toast{position:fixed;top:24px;left:50%;transform:translateX(-50%);padding:10px 24px;border-radius:8px;font-size:0.88rem;z-index:9999;display:none;animation:fadeDown .3s ease;text-align:center}
.toast.ok{background:#065f46;color:#6ee7b7}
.toast.err{background:#7f1d1d;color:#fca5a5}
@keyframes fadeDown{from{opacity:0;transform:translateX(-50%) translateY(-10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
</style>
</head>
<body>
<div class="container">
  <a href="https://xianbao.online" class="back">← 返回仙宝</a>

  <!-- 头像 -->
  <div class="card">
    <div class="card-title">🖼️ 头像</div>
    <div class="avatar-wrap">
      <div class="avatar" id="avatarDisplay">
        <input type="file" accept="image/*" id="avatarFile" onchange="uploadAvatar()">
      </div>
      <div style="font-size:0.82rem;color:#6b7280">点击头像选择图片上传</div>
    </div>
  
  </div>

  <!-- 账户信息 + 绑定 -->
  <div class="card">
    <div class="card-title">👤 账户信息</div>
    <div class="info-row">
      <span class="info-label">昵称</span>
      <input class="edit-input" id="editNickname" placeholder="设置昵称">
      <button class="edit-btn" onclick="saveField('nickname')">保存</button>
    </div>
    <div class="info-row">
      <span class="info-label">注册</span>
      <span class="info-value" id="infoCreated">-</span>
    </div>
    <div style="margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.06)">
      <div class="binding-item">
        <div class="binding-left"><div class="binding-icon phone">📱</div><div><div class="binding-name">手机号</div><div class="binding-status" id="bindPhoneVal">未绑定</div></div></div>
        <button class="btn btn-outline btn-sm" id="phoneBindBtn" onclick="openBindModal('phone')">绑定</button>
      </div>
      <div class="binding-item">
        <div class="binding-left"><div class="binding-icon email">✉️</div><div><div class="binding-name">邮箱</div><div class="binding-status" id="bindEmailVal">未绑定</div></div></div>
        <button class="btn btn-outline btn-sm" id="emailBindBtn" onclick="openBindModal('email')">绑定</button>
      </div>
      <div class="binding-item">
        <div class="binding-left"><div class="binding-icon wechat">W</div><div><div class="binding-name">微信</div><div class="binding-status" id="wxBindStatus">未绑定</div></div></div>
        <button class="btn btn-outline btn-sm" id="wxBindBtn" onclick="openBindModal('wechat')">绑定</button>
      </div>
    </div>
  </div>

  <!-- 密码 -->
  <div class="card">
    <div class="card-title">🔒 登录密码</div>
    <p style="font-size:0.82rem;color:#6b7280;margin-bottom:12px">重置链接将发送到你的注册邮箱</p>
    <button class="btn btn-outline btn-full" id="sendResetBtn" onclick="sendReset()">发送重置链接到邮箱</button>
  </div>

  <!-- VIP -->
  <div class="card">
    <div class="card-title">⭐ VIP会员</div>
    <div class="vip-row">
      <div>
        <div class="vip-plan free" id="vipPlan">免费版</div>
        <div class="vip-expires" id="vipExpires"></div>
      </div>
      <a href="https://xianbao.online/vip.html" class="btn btn-primary btn-sm" style="text-decoration:none">升级VIP</a>
    </div>
  </div>
</div>

<div id="bindModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:1000;align-items:center;justify-content:center" onclick="if(event.target===this)closeBindModal()">
  <div style="background:#14141e;border:1px solid #1e1e2a;border-radius:16px;padding:28px;width:340px;max-width:90vw">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px">
      <span style="font-size:16px;font-weight:600;color:#e0e0e0" id="bindModalTitle">绑定</span>
      <span onclick="closeBindModal()" style="cursor:pointer;color:#64748b;font-size:18px">&#10005;</span>
    </div>
    <div id="bindModalBody"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="https://xianbao.online/assets/xianbao/auth-widget.js"></script>
<script>
var AUTH='https://auth.xianbao.online';
function showToast(m,t){var e=document.getElementById('toast');e.textContent=m;e.className='toast '+(t||'ok');e.style.display='block';setTimeout(function(){e.style.display='none'},3000)}
function api(p,d,m){return fetch(AUTH+'/api'+p,{method:m||'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:d?JSON.stringify(d):void 0}).then(function(r){return r.json()})}
function apiGet(p){return fetch(AUTH+'/api'+p,{credentials:'include'}).then(function(r){return r.json()})}

XianbaoAuth.checkAuth().then(function(){
  if(!XianbaoAuth.isLoggedIn()){window.location.href='https://xianbao.online';return}
  loadData();
});

function loadData(){
  apiGet('/auth/me').then(function(d){
    if(!d.success)return;
    var u=d.data;
    document.getElementById('editNickname').value=(u.nickname&&u.nickname!=='微信用户')?u.nickname:'';
    loadBindings();
    document.getElementById('bindPhoneVal').textContent=u.phone||'未绑定';
    var pbtn=document.getElementById('phoneBindBtn');
    if(u.phone){pbtn.textContent='已绑定';pbtn.disabled=true;pbtn.style.opacity=.5}
    var emailDisp=(u.email&&u.email.indexOf('@wechat.local')>-1)?'微信登录':(u.email&&u.email.indexOf('@sms.local')>-1)?'手机号登录':(u.email||'-');
    document.getElementById('bindEmailVal').textContent=emailDisp;
    var ebtn=document.getElementById('emailBindBtn');
    if(u.email&&u.email.indexOf('@sms.local')===-1&&u.email.indexOf('@wechat.local')===-1){ebtn.textContent='已绑定';ebtn.disabled=true;ebtn.style.opacity=.5}
    document.getElementById('infoCreated').textContent=u.created_at?u.created_at.slice(0,10):'-';
updateAvatar(u.avatar_url,u.nickname||'?');
    if(u.plan&&u.plan!=='free'){
      document.getElementById('vipPlan').textContent='VIP会员';
      document.getElementById('vipPlan').className='vip-plan vip';
      if(u.expires_at)document.getElementById('vipExpires').textContent='到期: '+u.expires_at.slice(0,10);
    }
  });
}

function updateAvatar(url,name){
  var el=document.getElementById('avatarDisplay');
  var inp='<input type="file" accept="image/*" id="avatarFile" onchange="uploadAvatar()">';
  if(url)el.innerHTML='<img src="'+url+'" alt="">'+inp;
  else el.textContent=name.charAt(0).toUpperCase();
  // Ensure file input is always present
  if(!el.querySelector('#avatarFile')){
    var d=document.createElement('input');
    d.type='file';d.accept='image/*';d.id='avatarFile';
    d.onchange=function(){uploadAvatar()};
    d.style.cssText='position:absolute;inset:0;opacity:0;cursor:pointer';
    el.appendChild(d);
  }
}

function uploadAvatar(){
  var file=document.getElementById('avatarFile').files[0];
  if(!file)return;
  if(file.size>5*1024*1024){showToast('图片不能超过5MB','err');return}
  var fd=new FormData();fd.append('avatar',file);
  fetch(AUTH+'/api/auth/upload-avatar',{method:'POST',credentials:'include',body:fd}).then(function(r){return r.json()}).then(function(d){
    if(d.success){
      var url=d.data.url;
      updateAvatar(AUTH+url,document.getElementById('editNickname').value||'?');
      
      showToast('头像已上传');
    } else showToast(d.error||'上传失败','err');
  });
}

function saveField(field){
  var input=document.getElementById('edit'+field.charAt(0).toUpperCase()+field.slice(1));
  var val=input.value;
  if(!val){showToast('请输入'+field,'err');return}
  var body={};body[field]=val;
  api('/users/profile',body,'PATCH').then(function(d){
    if(d.success)showToast('已更新');
    else showToast(d.error||'保存失败','err');
  });
}

function openBindModal(type){
  var title=document.getElementById('bindModalTitle');
  var body=document.getElementById('bindModalBody');
  if(type==='phone'){
    title.textContent='📱 绑定手机号';
    body.innerHTML='<input id="bm-phone" placeholder="手机号" type="tel" maxlength="11" style="width:100%;padding:10px 14px;border:1px solid #1e1e2a;border-radius:8px;background:#0d0d12;color:#e0e0e0;font-size:14px;outline:none;margin-bottom:10px;box-sizing:border-box">'+
      '<div style="display:flex;gap:8px;margin-bottom:16px">'+
        '<input id="bm-code" placeholder="验证码" style="flex:1;padding:10px 14px;border:1px solid #1e1e2a;border-radius:8px;background:#0d0d12;color:#e0e0e0;font-size:14px;outline:none;box-sizing:border-box">'+
        '<button id="bm-send" style="padding:10px 14px;border:none;border-radius:8px;background:#1e1e2a;color:#94a3b8;font-size:13px;cursor:pointer;white-space:nowrap" onclick="bmSendCode(&quot;phone&quot;)">获取验证码</button>'+
      '</div>'+
      '<button onclick="bmBind(&quot;phone&quot;)" style="width:100%;padding:10px;border:none;border-radius:8px;background:linear-gradient(135deg,#7c3aed,#6d28d9);color:#fff;font-size:15px;font-weight:600;cursor:pointer">确认绑定</button>'+
      '<div id="bm-err" style="color:#f87171;font-size:13px;margin-top:10px;display:none"></div>';
  } else if(type==='email'){
    title.textContent='✉️ 绑定邮箱';
    body.innerHTML='<input id="bm-email" placeholder="邮箱" type="email" style="width:100%;padding:10px 14px;border:1px solid #1e1e2a;border-radius:8px;background:#0d0d12;color:#e0e0e0;font-size:14px;outline:none;margin-bottom:10px;box-sizing:border-box">'+
      '<div style="display:flex;gap:8px;margin-bottom:16px">'+
        '<input id="bm-code" placeholder="验证码" style="flex:1;padding:10px 14px;border:1px solid #1e1e2a;border-radius:8px;background:#0d0d12;color:#e0e0e0;font-size:14px;outline:none;box-sizing:border-box">'+
        '<button id="bm-send" style="padding:10px 14px;border:none;border-radius:8px;background:#1e1e2a;color:#94a3b8;font-size:13px;cursor:pointer;white-space:nowrap" onclick="bmSendCode(&quot;email&quot;)">获取验证码</button>'+
      '</div>'+
      '<button onclick="bmBind(&quot;email&quot;)" style="width:100%;padding:10px;border:none;border-radius:8px;background:linear-gradient(135deg,#7c3aed,#6d28d9);color:#fff;font-size:15px;font-weight:600;cursor:pointer">确认绑定</button>'+
      '<div id="bm-err" style="color:#f87171;font-size:13px;margin-top:10px;display:none"></div>';
  } else if(type==='wechat'){
    title.textContent='🔗 绑定微信';
    body.innerHTML='<div id="bm-wx" style="text-align:center;padding:8px 0"><p style="color:#94a3b8;font-size:13px;margin-bottom:12px">请用微信扫码，完成绑定</p><div id="bm-wx-qr" style="min-height:220px;display:flex;align-items:center;justify-content:center;color:#64748b;font-size:13px">加载中...</div></div>';
  }
  document.getElementById('bindModal').style.display='flex';
  if(type==='wechat') bmWxBind();
}
function closeBindModal(){
  document.getElementById('bindModal').style.display='none';
  if(wxBindTimer){clearInterval(wxBindTimer);wxBindTimer=null;}
}
function bmErr(m){
  var e=document.getElementById('bm-err');
  if(e){e.textContent=m;e.style.display=m?'block':'none';}
}
function bmSendCode(type){
  var field=type==='phone'?'bm-phone':'bm-email';
  var val=document.getElementById(field).value;
  var ok=type==='phone'?/^1[3-9]\d{9}$/.test(val):/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val);
  if(!ok){bmErr(type==='phone'?'请输入正确手机号':'请输入有效邮箱');return}
  var btn=document.getElementById('bm-send');btn.disabled=true;
  var p=type==='phone'?{phone:val}:{email:val};
  var ep=type==='phone'?'/auth/send-phone-code':'/send-code';
  api(ep,p).then(function(d){
    if(!d.success){bmErr(d.error||'发送失败');btn.disabled=false;return}
    bmErr('');
    var n=60,ot=btn.innerText;
    var timer=setInterval(function(){n--;btn.innerText=n+'s';if(n<=0){clearInterval(timer);btn.disabled=false;btn.innerText=ot}},1000);
  });
}
function bmBind(type){
  var val=document.getElementById(type==='phone'?'bm-phone':'bm-email').value;
  var code=document.getElementById('bm-code').value;
  if(!val||!code){bmErr('请填写完整');return}
  var p=type==='phone'?{phone:val,code:code}:{email:val,code:code};
  var ep=type==='phone'?'/auth/bind-phone':'/auth/bind-email';
  api(ep,p).then(function(d){
    if(!d.success){bmErr(d.error||'绑定失败');return}
    showToast(type==='phone'?'手机号已绑定':'邮箱已绑定');
    closeBindModal();
    loadData();
  });
}
function loadBindings(){
  apiGet('/auth/bindings').then(function(d){
    if(!d.success||!d.data)return;
    var wx=false;
    for(var i=0;i<d.data.length;i++){
      if(d.data[i].provider==='wechat')wx=true;
    }
    document.getElementById('wxBindStatus').textContent=wx?'已绑定':'未绑定';
    var btn=document.getElementById('wxBindBtn');
    if(wx){btn.textContent='已绑定';btn.disabled=true;btn.style.opacity=.5;}
  });
}
var wxBindTimer=null;
function bmWxBind(){
  var qr=document.getElementById('bm-wx-qr');
  api('/auth/wechat/qrcode?bind=1',{}).then(function(d){
    if(!d.success){qr.innerHTML='<p style="color:#f87171">'+(d.error||'获取二维码失败')+'</p>';return}
    var sid=d.data.sid;
    qr.innerHTML='<img src="'+d.data.qr+'" style="width:200px;height:200px;border-radius:8px">';
    if(wxBindTimer)clearInterval(wxBindTimer);
    wxBindTimer=setInterval(function(){
      api('/auth/wechat/status?sid='+sid).then(function(r2){
        if(r2.pending)return;
        clearInterval(wxBindTimer);
        if(r2.success&&r2.data&&r2.data.bound){
          qr.innerHTML='<p style="color:#34d399;font-size:15px">✅ 绑定成功</p>';
          setTimeout(function(){closeBindModal();loadData()},800);
        } else if(!r2.success){
          qr.innerHTML='<p style="color:#f87171">'+(r2.error||'绑定失败')+'</p>';
        }
      });
    },2000);
  });
}

function sendReset(){
  var btn=document.getElementById('sendResetBtn');btn.disabled=true;btn.textContent='发送中...';
  api('/password/send-reset',{}).then(function(d){
    if(d.success){showToast('验证邮件已发送，请查看邮箱（包括垃圾箱）')}
    else{showToast(d.error||'发送失败','err');btn.disabled=false;btn.textContent='发送重置链接到邮箱'}
  });
}
</script>
</body>
</html>
